schema {
  query: Query
}

type Query {
  me: CurrentUser
  users: [PublicUser!]!
  user(lookup: UserLookupInput!): PublicUser
}

type CurrentUser {
  id: ID!
  dateCreated: DateTime!
  displayName: String!
  fullName: String!
  email: String!
}

scalar DateTime

type PublicUser {
  id: ID!
  dateCreated: DateTime!
  displayName: String!
}

"""Uses the built-in `@oneOf` directive without declaring it."""
input UserLookupInput @oneOf {
  id: ID
  email: String
}